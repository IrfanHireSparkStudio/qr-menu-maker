# QR Menu Maker — Cloudflare Workers (not Pages)
# Deploy: see README.md

name = "qr-menu-maker"
main = "src/index.ts"
compatibility_date = "2026-11-08"

# Static assets (CSS + client JS) served from ./public.
# A request matching a file in ./public is served directly;
# every other request falls through to the Worker.
[assets]
directory = "./public"

# D1 database. Created already:
#   wrangler d1 create qr-menu-maker-db
# database_id below is the real one for this account — do not change it.
[[d1_databases]]
binding = "DB"
database_name = "qr-menu-maker-db"
database_id = "e36f9cdf-af11-4580-ba70-fba4a0bf6988"

# Workers KV namespace for menu photos (item photos, restaurant logos).
# Created already (no payment needed, unlike R2):
#   wrangler kv namespace create "qr-menu-maker-photos"
# Namespace ID below is the real one for this account — do not change it.
# If R2 billing is activated later, photos can move back to R2 (see README).
[[kv_namespaces]]
binding = "MENU_PHOTOS"
id = "e395a45b8f07457a9ae710f3f56a5d21"

[vars]
# Public Cloudflare Turnstile site key. This is NOT a secret and is safe to commit.
# Leave empty to run without Turnstile (the secret key is set via `wrangler secret put`).
TURNSTILE_SITE_KEY = ""
